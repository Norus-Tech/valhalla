name: Publish Docker image
on:
  push:
    branches:
      - "build"
    tags:
      - "*"
    paths-ignore:
      - ".circleci"
      - ".github"
      - "!.github/workflows/docker-build.yml"
      - ".gitignore"
      - "**.md"
      - "test/"
      - "test_requests/"
      - "docs/"
      - "**vcpkg**"
      - "run_route_scripts/"
      - ".*"
      - "pyproject.toml"
      - "setup.cfg"
      - "setup.py"
      - "taginfo.json"
jobs:
  build_and_publish:
    name: Auto-deploy docker image build
    if: ${{ github.repository_owner == 'Norus-Tech' }}
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
      with:
        submodules: 'recursive'
        fetch-depth: 0

    - name: Log in to GitHub Docker Registry
      uses: docker/login-action@v2
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build latest image
      run: |
        docker buildx build --push --platform linux/amd64 --tag ghcr.io/norus-tech/valhalla:latest .
